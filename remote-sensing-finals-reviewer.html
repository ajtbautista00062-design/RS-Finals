.confused { display: grid; gap: .6rem; }
.confused .cf { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .65rem .85rem; background: var(--surface); }
.confused .cf h4 { margin: 0 0 .25rem; font-size: .95rem; }
.steps { counter-reset: st; list-style: none; padding: 0 !important; display: grid; gap: .45rem; }
.steps li { counter-increment: st; position: relative; padding: .55rem .8rem .55rem 2.8rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); margin: 0 !important; }
.steps li::before { content: counter(st); position: absolute; left: .7rem; top: .5rem; width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: .85rem; }
.exercise { border: 1px solid var(--primary-line); border-radius: var(--radius); padding: 1rem; background: var(--surface); }
.lesson-nav { display: flex; justify-content: space-between; gap: .6rem; margin-top: 2rem; flex-wrap: wrap; }

/* Tables */
.table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); margin: .8rem 0; background: var(--surface); -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
caption { caption-side: bottom; text-align: left; padding: .5rem .75rem; font-size: .82rem; color: var(--muted); }
th, td { padding: .5rem .7rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { background: var(--surface-2); font-weight: 650; position: sticky; top: 0; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--primary-soft) 40%, transparent); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* Figures & formulas */
figure.fig { margin: 1rem 0; padding: .8rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
figure.fig figcaption { font-size: .85rem; color: var(--muted); margin-top: .5rem; }
.fig-svg { width: 100%; height: auto; display: block; max-height: 420px; }
.fig-svg text { font-family: var(--font); font-size: 13px; }
.fg-tx { fill: var(--text); } .fg-tx-b { fill: var(--accent); } .fg-gun-tx { fill: #fff; }
.fg-ln { stroke: var(--muted); stroke-width: 1.6; fill: none; } .fg-ln-a { stroke: var(--primary); stroke-width: 2.6; fill: none; }
.fg-ln-b { stroke: var(--accent); stroke-width: 2; fill: none; } .fg-ln-c { stroke: var(--c3); stroke-width: 2.6; fill: none; }
.fg-ln-thin { stroke: var(--border-strong); stroke-width: 1; fill: none; }
.fg-ah { fill: var(--muted); }
.fg-box { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.4; } .fg-box-a { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 1.4; }
.fg-box-c { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.2; } .fg-box-open { fill: none; stroke: var(--text); stroke-width: 1.4; }
.fg-fill-a { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 1.2; } .fg-fill-b { fill: var(--accent-soft); stroke: var(--accent-line); stroke-width: 1.2; }
.fg-fill-c { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.2; } .fg-fill-vis { fill: var(--c3-soft); stroke: var(--c3); stroke-width: 1.2; }
.fg-dot { fill: var(--muted); } .fg-pt-a { fill: var(--primary); } .fg-pt-b { fill: var(--accent); } .fg-pt-c { fill: var(--c3); }
.fg-pt-hi { fill: var(--bad); stroke: var(--surface); stroke-width: 1.5; }
.fg-cell { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1; }
.fg-cls-a { fill: color-mix(in srgb, var(--primary) 55%, var(--surface)); stroke: var(--surface); stroke-width: .6; }
.fg-cls-b { fill: color-mix(in srgb, var(--accent) 45%, var(--surface)); stroke: var(--surface); stroke-width: .6; }
.fg-cls-c { fill: color-mix(in srgb, var(--c3) 50%, var(--surface)); stroke: var(--surface); stroke-width: .6; }
.fg-stop-a { stop-color: color-mix(in srgb, var(--primary) 55%, var(--surface)); } .fg-stop-b { stop-color: color-mix(in srgb, var(--accent) 45%, var(--surface)); }
.fg-gun-r { fill: #b44a43; } .fg-gun-g { fill: #3f8a4e; } .fg-gun-b { fill: #3e66a8; }
.fg-shadow { fill: #1e1e1e; opacity: .55; } .fg-node { fill: var(--surface); stroke: var(--primary); stroke-width: 2; }
.formula { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: .9rem 1rem; margin: 1rem 0; }
.formula h4 { margin: 0 0 .4rem; }
.expr { font-family: var(--serif); font-size: 1.15rem; padding: .6rem .8rem; border-radius: var(--radius-sm); background: var(--surface-2); overflow-x: auto; white-space: nowrap; }
.formula dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .25rem .8rem; margin: .6rem 0 0; font-size: .9rem; }
.formula dt { font-family: var(--serif); font-weight: 600; } .formula dd { margin: 0; color: var(--muted); }
.formula .meta { margin-top: .5rem; font-size: .88rem; }

/* Practice */
.practice { max-width: 760px; margin: 0 auto; }
.qcard { padding: 1.3rem 1.4rem; }
.qmeta { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; margin-bottom: .7rem; }
.qmeta .spacer { flex: 1; }
.prompt { font-size: 1.14rem; line-height: 1.55; margin: .2rem 0 1rem; }
.prompt-label { font-size: .78rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.answer-row { display: flex; gap: .5rem; }
.answer-row input { font-size: 1.08rem; }
.answer-row .btn { flex: none; }
.hints { margin: .8rem 0 0; display: grid; gap: .35rem; }
.hint { padding: .45rem .7rem; border-radius: 8px; background: var(--accent-soft); font-size: .92rem; font-family: var(--mono); }
.feedback { margin-top: 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border); overflow: hidden; }
.feedback .fh { display: flex; align-items: center; gap: .55rem; padding: .7rem .9rem; font-weight: 700; }
.feedback.ok .fh { background: var(--ok-soft); color: var(--ok); }
.feedback.bad .fh { background: var(--bad-soft); color: var(--bad); }
.feedback.neutral .fh { background: var(--surface-2); color: var(--text); }
.feedback .fb { padding: .8rem .9rem; }
.feedback .canon { font-size: 1.1rem; font-weight: 700; }
.options { display: grid; gap: .55rem; margin: .4rem 0 1rem; }
.opt { display: flex; gap: .7rem; align-items: flex-start; width: 100%; text-align: left; padding: .75rem .9rem; border-radius: var(--radius-sm); border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; min-height: 48px; line-height: 1.45; }
.opt:hover:not([disabled]) { border-color: var(--primary-line); background: var(--primary-soft); }
.opt .k { flex: none; width: 1.7rem; height: 1.7rem; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); font-weight: 700; font-size: .85rem; }
.opt[aria-pressed="true"], .opt.sel { border-color: var(--primary); background: var(--primary-soft); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .why { display: block; font-size: .86rem; color: var(--muted); margin-top: .25rem; }
.opt[disabled] { cursor: default; }
.session-bar { display: flex; align-items: center; gap: .8rem; margin-bottom: 1rem; }
.session-bar .bar { flex: 1; }
.session-bar .count { font-size: .86rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.swatch { display: inline-block; width: 1.4rem; height: 1.4rem; border-radius: 5px; vertical-align: middle; border: 1px solid var(--border-strong); margin-right: .4rem; }
.matrix-mini { overflow-x: auto; margin: .2rem 0 .8rem; }
.matrix-mini table { font-size: .85rem; min-width: 420px; }
.matrix-mini th, .matrix-mini td { padding: .3rem .45rem; text-align: center; }
.matrix-mini td.diag { background: var(--ok-soft); font-weight: 700; }
.result-head { display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: center; }
.score-ring { width: 110px; height: 110px; }

/* Flashcards */
.flash { perspective: 1200px; }
.flashcard { min-height: 260px; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 1.6rem; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); }
.flashcard .side-label { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: .6rem; }
.flashcard .face { font-size: 1.22rem; line-height: 1.5; }
.flashcard .face.term { font-size: 1.55rem; font-weight: 700; }
.flashcard .back { margin-top: 1.2rem; padding-top: 1.2rem; border-top: 1px dashed var(--border-strong); }
.ratings { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; margin-top: 1rem; }
.ratings .btn { flex-direction: column; gap: 0; min-height: 58px; }
.ratings .btn small { font-weight: 500; color: var(--muted); }
.rate-again { border-color: color-mix(in srgb, var(--bad) 55%, transparent) !important; }
.rate-easy { border-color: color-mix(in srgb, var(--ok) 55%, transparent) !important; }

/* Recall / focus */
body.focus-mode .topbar, body.focus-mode .sidebar, body.focus-mode .bottombar { display: none !important; }
body.focus-mode .layout { display: block; }
body.focus-mode main { padding-top: 2.5rem; }
.recall-card { max-width: 720px; margin: 0 auto; padding: 2rem; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); }
.recall-card .prompt { font-size: 1.28rem; text-align: center; margin: 1rem 0 1.4rem; }
.recall-card .model { white-space: pre-line; padding: 1rem; border-radius: var(--radius-sm); background: var(--surface-2); line-height: 1.6; }
.timer { font-variant-numeric: tabular-nums; font-family: var(--mono); color: var(--muted); }

/* Exam */
.exam-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 1.2rem; align-items: start; }
.palette { position: sticky; top: calc(var(--topbar-h) + 16px); }
.palette .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: .35rem; }
.palette .cell { height: 38px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; position: relative; }
.palette .cell.answered { background: var(--primary-soft); border-color: var(--primary-line); }
.palette .cell.current { outline: 2px solid var(--primary); outline-offset: 1px; }
.palette .cell.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.time-left { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.time-left.low { color: var(--bad); }

/* Calendar */
.cal-head { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .8rem; }
.cal-head h2 { margin: 0 .5rem 0 0; min-width: 11ch; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .35rem; }
.cal-dow { text-align: center; font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: .2rem 0; }
.cal-day { min-height: 84px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: .35rem .4rem; text-align: left; font: inherit; color: var(--text); cursor: pointer; display: flex; flex-direction: column; gap: .2rem; }
.cal-day:hover { border-color: var(--primary-line); }
.cal-day.out { opacity: .45; }
.cal-day.today { border: 2px solid var(--accent); }
.cal-day[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); }
.cal-day .n { font-weight: 700; font-size: .88rem; }
.cal-day .marks { display: flex; flex-wrap: wrap; gap: .2rem; margin-top: auto; }
.mk { font-size: .68rem; line-height: 1.1rem; padding: 0 .3rem; border-radius: 5px; font-weight: 700; }
.mk.act { background: var(--primary); color: var(--primary-ink); }
.mk.due { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line); }
.mk.plan { background: var(--c3-soft); color: var(--c3); }
.mk.exam { background: var(--bad-soft); color: var(--bad); }
.cal-legend { display: flex; gap: .8rem; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin: .6rem 0; }
.task { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid var(--border); }
.task .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.task.done .txt { text-decoration: line-through; color: var(--muted); }

/* Coverage */
.status { font-size: .74rem; font-weight: 700; padding: .05rem .4rem; border-radius: 5px; white-space: nowrap; }
.status.S { background: var(--ok-soft); color: var(--ok); } .status.T, .status.O, .status.X, .status.R { background: var(--surface-2); color: var(--muted); }
.status.D { background: var(--info-soft); color: var(--info); } .status.U { background: var(--accent-soft); color: var(--accent); }

/* Toast & modal */
#toast { position: fixed; left: 50%; bottom: calc(var(--bottom-h) + 18px); transform: translateX(-50%); z-index: 80; display: grid; gap: .4rem; width: min(92vw, 420px); pointer-events: none; }
.toast { pointer-events: auto; background: var(--text); color: var(--bg); padding: .7rem 1rem; border-radius: 10px; box-shadow: var(--shadow); font-size: .92rem; animation: tin .2s ease; }
.toast.bad { background: var(--bad); color: #fff; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.modal-back { position: fixed; inset: 0; z-index: 90; background: rgba(15, 20, 25, .45); display: grid; place-items: center; padding: 1rem; }
.modal { width: min(640px, 100%); max-height: calc(100vh - 2rem); overflow: auto; background: var(--surface); color: var(--text); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); padding: 1.3rem 1.4rem; }
.modal.wide { width: min(860px, 100%); }
.modal-head { display: flex; align-items: center; gap: .6rem; margin-bottom: .8rem; }
.modal-head h2 { margin: 0; } .modal-head .spacer { flex: 1; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); width: min(360px, 92vw); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: .4rem; z-index: 50; }
.menu button, .menu a { display: flex; gap: .7rem; align-items: flex-start; width: 100%; text-align: left; padding: .65rem .7rem; border: 0; background: none; color: var(--text); font: inherit; border-radius: 8px; cursor: pointer; text-decoration: none; }
.menu button:hover, .menu a:hover { background: var(--surface-2); }
.menu b { display: block; font-size: .93rem; } .menu span { display: block; font-size: .8rem; color: var(--muted); }
.menu hr { margin: .3rem .4rem; }
.dl-wrap { position: relative; }

/* Reading mode */
body.reading { --measure: 64ch; }
body.reading .lesson { font-size: 1.08rem; line-height: 1.75; margin: 0 auto; }
body.reading .lesson-layout { grid-template-columns: minmax(0, 1fr); }
body.reading .lesson-layout .toc { display: none; }
body.reading .sidebar { display: none; } body.reading .layout { grid-template-columns: minmax(0, 1fr); }

/* Responsive */
@media (max-width: 1100px) { .grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lesson-layout { grid-template-columns: 220px minmax(0, 1fr); } .exam-wrap { grid-template-columns: minmax(0, 1fr); } .palette { position: static; } }
@media (max-width: 900px) {
  :root { --topbar-h: 56px; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; z-index: 60; top: 0; left: 0; height: 100vh; width: min(84vw, 300px); transform: translateX(-102%); transition: transform .22s ease; box-shadow: var(--shadow); padding-top: 1rem; }
  .sidebar.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(15, 20, 25, .4); z-index: 55; }
  .topbar .menu-btn { display: inline-flex; }
  .search-wrap { margin-left: .3rem; }
  .lesson-layout { grid-template-columns: minmax(0, 1fr); }
  .toc { position: static; max-height: none; }
  .toc-mobile-hide { display: none; }
  .bottombar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 35; left: 0; right: 0; bottom: 0; height: calc(var(--bottom-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--border); }
  .bottombar a, .bottombar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .7rem; font-weight: 600; color: var(--muted); text-decoration: none; background: none; border: 0; font-family: inherit; cursor: pointer; }
  .bottombar [aria-current="page"] { color: var(--primary); }
  main { padding-bottom: calc(var(--bottom-h) + 2.5rem); }
  body.typing .bottombar { display: none; }
  .grid.two, .grid.three { grid-template-columns: minmax(0, 1fr); }
  .hero { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 600px) {
  .brand-text span { display: none; }
  .search-wrap { flex-basis: 40px; }
  .search-wrap input::placeholder { color: transparent; }
  .search-wrap:focus-within { position: absolute; left: .5rem; right: .5rem; top: 50%; transform: translateY(-50%); z-index: 45; max-width: none; margin: 0; }
  .search-wrap:focus-within input { background: var(--surface); box-shadow: var(--shadow); }
  .search-wrap:focus-within input::placeholder { color: var(--faint); }
  .search-results { position: fixed; left: .5rem; right: .5rem; top: calc(var(--topbar-h) + 4px); }
  .top-actions .lbl { display: none; }
  .grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { padding: 1rem; }
  .qcard { padding: 1rem; }
  .answer-row { flex-direction: column; }
  .answer-row .btn { width: 100%; }
  .ratings { grid-template-columns: repeat(2, 1fr); }
  .cal-day { min-height: 58px; padding: .25rem; }
  .cal-day .marks .mk { font-size: .6rem; padding: 0 .2rem; }
  h1 { font-size: 1.35rem; }
  .prompt { font-size: 1.05rem; }
  .formula dl { grid-template-columns: minmax(0, 1fr); } .formula dd { margin-bottom: .3rem; }
  .matrix-mini table { min-width: 0; font-size: .74rem; }
  .matrix-mini th, .matrix-mini td { padding: .25rem .2rem; }
  .matrix-mini caption { white-space: normal; }
  main { padding-left: .75rem; padding-right: .75rem; }
  .page-head p { font-size: .95rem; }
}
@media (max-width: 380px) { .brand-text b { font-size: .9rem; } .topbar { gap: .3rem; padding: 0 .5rem; } }

/* Motion */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; } }
:root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before, :root[data-motion="reduce"] *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }

/* Print */
#print-root { display: none; }
@media print {
  :root { --bg: #fff; --surface: #fff; --surface-2: #f3f3f3; --text: #000; --muted: #333; --border: #bbb; color-scheme: light; }
  body { background: #fff; font-size: 11pt; }
  body.printing #app, body.printing #toast, body.printing #modal-root { display: none !important; }
  body.printing #print-root { display: block; }
  .print-topic { break-inside: auto; page-break-before: auto; }
  .print-lecture { page-break-before: always; }
  .print-lecture:first-of-type { page-break-before: auto; }
  .table-wrap { overflow: visible; border: 1px solid #999; }
  th { position: static; }
  figure.fig, .formula, .note, table { break-inside: avoid; }
  a { color: #000; text-decoration: none; }
  .no-print { display: none !important; }
}

/* Shared visual system. System fonts and inline assets keep the reviewer offline. */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --surface-2: #edf2f0; --surface-3: #e1e9e5;
  --border: #dce5e0; --border-strong: #b8c9c0;
  --text: #1d302a; --muted: #52665c; --faint: #5d7066;
  --primary: #21634e; --primary-hover: #174c3b; --primary-soft: #e6f1eb; --primary-line: #9cc6ae;
  --shadow: 0 2px 4px #183e2d03, 0 6px 22px #183e2d05;
  --radius: 16px; --radius-sm: 10px; --side-w: 248px; --topbar-h: 76px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101b17; --surface: #182720; --surface-2: #21352b; --surface-3: #2c4236;
    --border: #30483a; --border-strong: #526e5d; --text: #e8f0eb; --muted: #b1c5b8; --faint: #a1b9aa;
    --primary: #9ed4b5; --primary-hover: #bde7cc; --primary-ink: #10251a;
    --primary-soft: #233e2e; --primary-line: #547e62; --shadow: 0 4px 18px #00000015;
  }
}
:root[data-theme="dark"] {
  --bg: #101b17; --surface: #182720; --surface-2: #21352b; --surface-3: #2c4236;
  --border: #30483a; --border-strong: #526e5d; --text: #e8f0eb; --muted: #b1c5b8; --faint: #a1b9aa;
  --primary: #9ed4b5; --primary-hover: #bde7cc; --primary-ink: #10251a;
  --primary-soft: #233e2e; --primary-line: #547e62; --shadow: 0 4px 18px #00000015;
}
body { letter-spacing: -.012em; }
h1, h2, h3 { letter-spacing: -.035em; }
.topbar { padding-inline: 24px; gap: 20px; background: var(--surface); backdrop-filter: none; }

  summary: 'Parametric classifiers (e.g., maximum likelihood) assume a data distribution. Non-parametric classifiers such as artificial neural networks and decision trees make no such assumption, and each has its own strengths and weaknesses.',
  keys: ['l10.parametric', 'l10.nonparametric', 'l10.ann', 'l10.neuron', 'l10.blackbox', 'l10.dt', 'l10.recursive'],
  blocks: [
    ['h', 'Parametric classifiers (slide 41)'],
    ['ul', ['e.g., **maximum likelihood**; rely on assumptions of **data distribution**.', 'Performance depends on how well the data match the pre-defined model, and on the accuracy of model parameter estimation.', 'Suffer from the **Hughes phenomenon**: difficult to have a significant number of training pixels.', 'Not adequate to **integrate ancillary data**: difficulties classifying data at different measurement scales and units.']],
    ['h', 'Artificial Neural Network (ANN) (slides 42–43)'],
    ['fig', 'fig-ann', 'Remotely sensed discriminating variables enter the input layer, pass through a hidden layer, and the output layer gives class 1…n. All neurons are interlinked by weighted connections.'],
    ['table', ['ANN pros', 'ANN cons'], [
      ['Non-parametric: no requirement on the assumed statistical distribution of data', 'Semantically poor (black box)'],
      ['High computation rate → real-time processing of huge datasets', 'Training can be computationally demanding and slow'],
      ['', 'Perceived as difficult to apply successfully: hard to select network architecture, initial values of parameters, number of iterations required, choice of initial weights']], null],
    ['h', 'Decision Trees (DT) (slides 44–45)'],
    ['fig', 'fig-dtree', 'Example tree (Tso & Mather, 2001): if NIR > 50% and red < 12% → vegetation; if NIR < 5% and red < 10% → water; other branches are left undetermined (“?”).'],
    ['table', ['DT pros', 'DT cons'], [
      ['Not based on any assumption on training data distribution', 'Use of hyperplane decision boundaries parallel to feature axes'],
      ['Can reveal nonlinear and hierarchical relationships between input variables to predict class membership', 'May restrict use to cases in which classes are clearly distinguishable'],
      ['Set of rules is easy to interpret', ''], ['Unlike ANN, does not need extensive design and training', ''], ['Good computational efficiency', '']], null],
    ['note', 'n10-dtbound']
  ],
  confused: [['ANN', 'Decision tree', 'Both are non-parametric. ANN is a black box that needs careful design and training. DT rules are easy to interpret and need no extensive design or training, but its boundaries are axis-parallel.'],
    ['Parametric', 'Non-parametric', 'Parametric assumes a distribution (normal for ML) and estimates its parameters. Non-parametric makes no such assumption, so it can integrate ancillary data with different scales and units.']],
  aid: 'Learning aid: “Trees Talk, Nets Hide.” Decision-tree rules can be read; neural-network weights cannot.'
});

topic({
  id: 'L10-hardsoft', lec: 'L10', title: 'Hard (crisp) vs soft (fuzzy) classification', p: [40, 41, 46],
  summary: 'Hard classification forces each pixel into one class. Soft (fuzzy) classification allows multiple, partial memberships (grades from 0 to 1), which suits mixed pixels and class continua.',
  keys: ['l10.hard', 'l10.soft', 'l10.membership', 'l10.grade'],
  blocks: [
    ['table', ['Hard (crisp)', 'Soft (fuzzy)'], [['A pixel is constrained to a single class', 'A pixel may display multiple and partial class membership; proposed alternative to deal with “mixels”']], 'Slide 46.'],
    ['fig', 'fig-fuzzy', 'Jensen (1996), hypothetical NIR brightness. Hard rules: 0–30 → water, 30–60 → forested wetland, 60–90 → upland forest. Fuzzy membership functions overlap: water falls from 1 at 24 to 0 at 36, forested wetland is 1 from 36 to 55, upland forest rises from 55 to 70.'],
    ['ul', ['Decision rules are defined as **membership functions** for each class.', 'Membership functions allocate to each pixel a real value between 0 and 1: the **membership grade**.',
      'Reading the figure: at brightness 30 a pixel is about 0.5 water and 0.5 forested wetland. At 60 it is about 0.7 forested wetland and 0.3 upland forest.']],
    ['p', 'Conclusion (slide 53): soft classifications have notable advantages over hard ones, including the ability to discriminate **physical class continua** and to provide estimates of **subpixel class component fractions**.']
  ],
  confused: [['Hard decision rule at 45', 'Fuzzy membership at 45', 'Hard: 45 is in 30–60, so the pixel is forested wetland only. Fuzzy: 45 lies on the plateau (36–55), so forested wetland = 1 and the other classes = 0. The two agree here and differ near the class edges.']],
  aid: 'Learning aid: Hard = “one box per pixel.” Soft = “percent of each class per pixel.”'
});

topic({
  id: 'L10-post', lec: 'L10', title: 'Ancillary data integration, post-classification processing and conclusions', p: [42, 43, 44, 45, 46],
  summary: 'Ancillary data can refine a classified map through post-classification sorting. Post-processing is needed when the MMU exceeds the SUA (generalisation, upscaling) or when a vector map is made from pixels (raster-to-vector conversion).',
  keys: ['l10.ancint', 'l10.pcsort', 'l10.generalisation', 'l10.upscaling', 'l10.r2v', 'l10.semgen', 'l10.heuristic'],
  blocks: [
    ['h', '6. Ancillary data integration (slide 49)'],
    ['ul', ['Ancillary data can be integrated **after** image classification to improve the results.', '**Post-classification sorting**: application of very specific rules to the classified image and geographical ancillary data (e.g., elevation, slope, aspect).', 'Strategies based on expert-, rule-, and knowledge-based systems.']],
    ['h', '7. Post-classification processing (slide 50)'],
    ['table', ['Case', 'Post-processing required'], [
      ['The MMU of the final map is larger than the spatial unit used in the classification', 'Map generalisation ↔ upscaling'],
      ['The final map has a vector format and the SUA was the pixel', 'Raster to vector conversion']], 'Post processing is required in two cases.'],
    ['table', ['Mapping approach (slide 51)', 'Processing chain'], [
      ['Raster map, MMU = pixel size of input data', 'Feature selection > image classification > accuracy assessment'],
      ['Raster map, MMU > pixel size', 'Feature selection > image classification > post-processing (upscaling) > accuracy assessment'],
      ['Vector map, SUA = image pixel', 'Feature selection > image classification > post-processing (generalisation + raster to vector conversion) > accuracy assessment'],
      ['Vector map, SUA = object', 'Image segmentation (generate the objects) > feature selection > image classification > post-processing (generalisation) > accuracy assessment']], null],
    ['p', '**Semantic generalisation** (slide 52): a classified map with MMU = 1 pixel (30 m × 30 m) is generalised in steps to MMU = 5 ha (classes shrubland, forest, agriculture, bare soil), so small patches are absorbed into their surroundings.'],
    ['h', 'Conclusions (slide 53)'],
    ['ul', ['Thematic classification methods are either **heuristic (nonparametric)** or based on statistical distribution assumptions (**parametric**).', 'No classifier is best for all applications. Performance is strongly **data-dependent** if class signatures overlap. If class distributions are Gaussian, maximum likelihood gives minimum total misclassification error.', 'Soft classifications can discriminate physical class continua and estimate subpixel class fractions.']],
    ['note', 'n10-ml']
  ],
  confused: [['Upscaling / generalisation', 'Raster to vector conversion', 'Generalisation and upscaling fix a SIZE mismatch (MMU > SUA). Raster-to-vector conversion fixes a FORMAT mismatch (pixel SUA but vector map).']],
  aid: 'Learning aid: post-processing answers “Too small?” (generalise) and “Wrong format?” (vectorize).'
});

R('L10-R01', 'L10', 'L10-classic', 'diff', 'Compare parallelepiped, minimum distance and maximum likelihood classifiers (rule, pro, con).', 'Parallelepiped: min/max DN boxes | simple, fast | gaps (unclassified) and overlaps. Minimum distance: closest class mean | simple, efficient | insensitive to variance. Maximum likelihood: variance/covariance, normal assumption, probability with threshold | accounts for variation | computationally intensive, multimodal classes need care.', [28, 29, 30], 'l10.parallelepiped');

R('L10-R03', 'L10', 'L10-supunsup', 'steps', 'List the steps of unsupervised classification, including the loop.', '1 Specify min and max number of classes; 2 set arbitrary pixels as cluster centers; 3 define class centroids; 4 assign pixels to the nearest centroids; 5 calculate new centroids. Different set? Yes → repeat step 4; No → 6 match information classes to spectral classes.', [26], 'l10.unsupervised');
R('L10-R04', 'L10', 'L10-mapping', 'diff', 'Explain the difference between MMU and SUA.', 'MMU = smallest area represented in the final map (pixel for raster, smallest object for vector). SUA = unit to which the classification algorithm is applied (pixel → per-pixel/sub-pixel; object → object-oriented). If MMU > SUA, generalisation/upscaling is needed.', [16, 43], 'l10.mmu');
R('L10-R05', 'L10', 'L10-param', 'diff', 'Contrast ANN and decision trees (pros and cons).', 'ANN: non-parametric, high computation rate | black box, slow training, hard to choose architecture, parameters, iterations, weights. DT: no distribution assumption, reveals nonlinear/hierarchical relationships, easy rules, no extensive design/training, efficient | axis-parallel boundaries, best when classes are clearly distinguishable.', [37, 39], 'l10.ann');

R('L10-R07', 'L10', 'L10-hardsoft', 'diff', 'Explain hard vs soft classification using the Jensen example.', 'Hard: one class per pixel by thresholds (0–30 water, 30–60 forested wetland, 60–90 upland forest). Soft: membership functions give grades 0–1 for every class (e.g., brightness 60 → ~0.7 forested wetland, ~0.3 upland forest), so mixels and continua are represented.', [40, 41], 'l10.soft');

// ───────────────────────── FORMULAS ─────────────────────────
F({ id: 'f-oa', lec: 'L11', topic: 'L11-matrix', name: 'Total (overall) accuracy', expr: 'Accuracy_{Total} = (Σ diagonal) / N × 100', vars: [['Σ diagonal', 'sum of correctly classified plots (diagonal cells)'], ['N', 'total number of plots']], units: '%', example: '(65 + 81 + 85 + 90) / 434 × 100 = 74%', assume: 'Counts are reference plots, not pixels of the whole map.', p: [10] });
F({ id: 'f-ua', lec: 'L11', topic: 'L11-uapa', name: 'User’s accuracy (class i)', expr: 'UA_{i} = X_{ii} / X_{i+} × 100', vars: [['X_{ii}', 'correct plots of class i (diagonal)'], ['X_{i+}', 'ROW total = plots the map claims for class i (lecture orientation)']], units: '%', example: 'Built-up: 65 / 115 × 100 = 57%', assume: 'Rows = classified data. If a matrix is transposed, use its column total instead.', p: [12, 13] });
F({ id: 'f-pa', lec: 'L11', topic: 'L11-uapa', name: 'Producer’s accuracy (class i)', expr: 'PA_{i} = X_{ii} / X_{+i} × 100', vars: [['X_{ii}', 'correct plots of class i'], ['X_{+i}', 'COLUMN total = plots actually in reference class i (lecture orientation)']], units: '%', example: 'Built-up: 65 / 75 × 100 = 87%', assume: 'Columns = reference data.', p: [14, 15] });
F({ id: 'f-err', lec: 'L11', topic: 'L11-uapa', name: 'Commission and omission error', expr: 'Commission_{i} = 100% − UA_{i};  Omission_{i} = 100% − PA_{i}', vars: [['UA_{i}', 'user’s accuracy'], ['PA_{i}', 'producer’s accuracy']], units: '%', example: 'Built-up: commission 43.5%, omission 13.3%', assume: 'Derived relation (standard), consistent with slides 14 and 16.', p: [12, 14] });
F({ id: 'f-kappa-simple', lec: 'L11', topic: 'L11-kappa', name: 'Kappa (concept form)', expr: 'K̂ = (observed accuracy − chance agreement) / (1 − chance agreement)', vars: [['observed accuracy', 'Σ diagonal / N'], ['chance agreement', 'Σ (X_{i+}·X_{+i}) / N²']], units: 'dimensionless', example: '(0.7396 − 0.2485) / (1 − 0.2485) = 0.65', assume: 'Lecture states range 0–1 (see clarification).', p: [17] });
F({ id: 'f-khat', lec: 'L11', topic: 'L11-kappa', name: 'KHAT (computational form)', expr: 'K̂ = [N Σ_{i=1}^{r} X_{ii} − Σ_{i=1}^{r} (X_{i+}·X_{+i})] / [N² − Σ_{i=1}^{r} (X_{i+}·X_{+i})]', vars: [['r', 'number of rows in the confusion matrix'], ['X_{ii}', 'observations in row i, column i'], ['X_{i+}', 'marginal total of row i (right of matrix)'], ['X_{+i}', 'marginal total of column i (bottom of matrix)'], ['N', 'total number of samples in the matrix']], units: 'dimensionless', example: '(434·321 − 46,814) / (434² − 46,814) = 92,500 / 141,542 = 0.65', assume: '', p: [18, 19] });

NOTE('n12-deck', 'L12', 'L12-tir', [2, 25], 'Title slides read “TC 24 LECTURE 11 (Part 1)” and “(Part 2)”.', 'The source deck was numbered Lecture 11 in its original training course (TC 24). In this course it is Lectures 12 and 13. The content is the same.');
NOTE('n12-range', 'L12', 'L12-tir', [5, 6], 'Objects emit EM energy “in 3.0–100 µm”; for satellite use, TIR is limited to 3–5 µm and 8–14 µm.', 'The 3–100 µm span is the broad thermal-IR region. Atmospheric absorption (H₂O, CO₂, O₃) leaves the 3–5 µm and 8–14 µm windows usable from space. Earth-surface sensors (e.g., Landsat TM band 6, 10.4–12.5 µm) sit in the 8–14 µm window.');
NOTE('n12-spell', 'L12', 'L12-tir', [6], 'Laws named “Wiens Law” and “Kirchof’s Law.”', 'Correct spellings: Wien’s (displacement) law and Kirchhoff’s law. The slides name Kirchhoff’s law but do not explain it. Clarification: Kirchhoff’s radiation law says that at thermal equilibrium a body’s emissivity equals its absorptivity (good absorbers are good emitters).');
NOTE('n12-tirs', 'L12', 'L12-tir', [7], 'Slide title: “What TIRS measures.”', 'Used here generically for thermal-infrared sensing. TIRS is also the name of the Landsat 8/9 Thermal Infrared Sensor (Lecture 9).');
NOTE('n12-sb', 'L12', 'L12-laws', [10], '“The amount of energy, radiant flux (F_R), emitted by an object is directly proportional to its temperature,” and “radiation increases exponentially with temperature.”', 'F_R = εσT⁴: emission is proportional to the FOURTH POWER of absolute temperature (a power law, not strictly exponential). Doubling T multiplies emission by 2⁴ = 16. Absolute zero is 0 K (written without a degree sign) = −273.15 °C.');
NOTE('n12-sigma', 'L12', 'L12-laws', [10, 13], 'σ = 5.67 × 10⁻¹² W cm⁻² K⁻⁴ (slide 11), while slide 14 gives M_B = σT⁴ in W m⁻².', 'Both are the same constant in different units: 5.67 × 10⁻⁸ W m⁻² K⁻⁴ = 5.67 × 10⁻¹² W cm⁻² K⁻⁴ (because 1 m² = 10⁴ cm²). Check which unit the question uses.');
NOTE('n12-800k', 'L12', 'L12-laws', [14], 'Forest fires: “800ºK (527 ºC) ~3.62 µm.” Soil, water, rock: “300ºK (27 ºC) 9.66 µm.”', 'Write kelvin without a degree sign: 800 K and 300 K. Check: 2898/800 = 3.62 µm and 2898/300 = 9.66 µm (Wien’s law with λ in µm and T in K).');
NOTE('n12-modis', 'L12', 'L12-thermalapps', [17], 'MODIS: “36 bands, 1 in SWIR, 6 in mid IR, 10 in thermal IR.”', 'MODIS has 36 bands from about 0.4 to 14.4 µm. The slide counts only some infrared groups: 6 mid-IR (bands 20–25) and 10 thermal IR (bands 27–36) make up MODIS’s 16 thermal emissive bands. The remaining visible–SWIR bands are not itemized on the slide. MODIS flies on Terra and Aqua, and mission status should be checked in current NASA sources.');
NOTE('n12-npoess', 'L12', 'L12-thermalapps', [23], 'NPOESS (joint NOAA/NASA/DoD): “middle-wave thermal 8 bands, long-wave thermal 4 bands, 400–800 m”; GOES bands 3.78–4.03, 6.47–7.02, 10.2–11.2, 11.5–12.5 µm.', 'These are HISTORICAL specifications. NPOESS was restructured in 2010, and its VIIRS instrument now flies on the Suomi NPP and JPSS (NOAA-20, NOAA-21) satellites with a different final band design. The GOES bands listed are from the older GOES imagers; the current GOES-R series uses the 16-band ABI. Learn the slide values for the exam, but do not treat them as current mission facts.');
NOTE('n12-bandcodes', 'L12', 'L12-mw', [32], 'Band table boundaries: Ka 0.75–1.18 cm / K 1.19–1.67 cm (26.5 GHz); X 2.4–3.8 cm / C 3.9–7.5 cm (8.0 GHz).', 'Using ν(GHz) = 30/λ(cm), 26.5 GHz corresponds to 1.13 cm and 8.0 GHz to 3.75 cm. The slide’s wavelength edges are rounded slightly differently. Use the slide values on the exam and expect small rounding differences in other sources.');
NOTE('n12-cband', 'L12', 'L12-scatter', [45], '“C-band (cm–tens of cm): low penetration depth, leaves / needles / twigs.”', 'From the band table (slide 33), C-band wavelengths are 3.9–7.5 cm, i.e., a few centimetres. “Tens of cm” describes L-band (15–30 cm) and P-band (30–100 cm). The key idea still holds: shorter wavelength → less canopy penetration.');
NOTE('n12-layover', 'L12', 'L12-distort', [58], 'The slide heading on PDF p. 58 displays “Foreshortening”, while its bullet text defines LAYOVER (“extreme case of foreshortening, when incidence angle is less than slope angle toward radar (θ < α)”).', 'Layover is the extreme case of foreshortening: the top of a slope facing the radar is imaged before its base, because θ < α. Layover cannot be corrected. Foreshortening compresses the slope without reversing it.');
NOTE('n12-rangeres', 'L12', 'L12-geom', [53], 'R_r = τc / (2 cos γ), with γ = depression angle.', 'Equivalent form: R_r = τc / (2 sin θ), with θ the look (incidence) angle on flat terrain, because θ = 90° − γ. Range resolution is FINER (smaller) in the FAR range, where the depression angle is smaller.');
NOTE('n12-azres', 'L12', 'L12-geom', [54], 'R_a = S × λ / L (slant range × wavelength / antenna length), shown for a real aperture radar beam.', 'This is the real-aperture formula: azimuth resolution coarsens with range and improves with a longer antenna. The example values imply λ/L = 0.006 (e.g., a 3 cm wavelength with a 5 m antenna); the slide does not state λ or L. Synthetic aperture radar (SAR) synthesizes a long antenna, which makes azimuth resolution much finer and nearly independent of range.');

F({ id: 'f-sb', lec: 'L12', topic: 'L12-laws', name: 'Stefan–Boltzmann law', expr: 'F_{R} = ε σ T_{k}^{4}   (blackbody: M_{B} = σ T^{4})', vars: [['F_{R}', 'radiant flux emitted by the object'], ['ε', 'emissivity (dimensionless, 0–1)'], ['σ', '5.67 × 10⁻¹² W cm⁻² K⁻⁴ (= 5.67 × 10⁻⁸ W m⁻² K⁻⁴)'], ['T_{k}', 'kinetic temperature in kelvin']], units: 'W cm⁻² (slide 11) or W m⁻² (slide 14)', example: 'Blackbody at 300 K: 5.67×10⁻⁸ × 300⁴ ≈ 459 W m⁻². Doubling T → ×16.', assume: 'T must be absolute (K). Emission scales with T⁴.', p: [10, 13] });
F({ id: 'f-wien', lec: 'L12', topic: 'L12-laws', name: 'Wien’s displacement law', expr: 'λ_{max} = 2898 / T', vars: [['λ_{max}', 'dominant (peak) wavelength in µm'], ['T', 'temperature in K']], units: 'µm', example: '300 K → 9.66 µm; 800 K → 3.62 µm', assume: 'Constant 2898 µm·K.', p: [13, 14] });
F({ id: 'f-emis', lec: 'L12', topic: 'L12-laws', name: 'Emissivity', expr: 'ε = M_{R} / M_{B} = T_{rad}^{4} / T_{kin}^{4}', vars: [['M_{R}', 'exitance of the real material'], ['M_{B}', 'blackbody exitance at the same temperature'], ['T_{rad}', 'radiant temperature'], ['T_{kin}', 'kinetic temperature']], units: 'dimensionless', example: 'ε = 0.9, T_kin = 300 K → T_rad ≈ 292.2 K', assume: 'Same temperature for M_R and M_B.', p: [11, 13] });
F({ id: 'f-trad', lec: 'L12', topic: 'L12-laws', name: 'Radiant from kinetic temperature (derived)', expr: 'T_{rad} = ε^{1/4} · T_{kin}', vars: [['ε', 'emissivity'], ['T_{kin}', 'kinetic temperature (K)']], units: 'K', example: '0.95^{0.25} × 300 = 296.2 K', assume: 'Rearranged from ε = T_rad⁴/T_kin⁴ (derived, not printed on the slide).', p: [13] });
F({ id: 'f-planck', lec: 'L12', topic: 'L12-laws', name: 'Brightness temperature (Planck)', expr: 'L(λ, T_{b}) = 2πhc² / [λ⁵ (e^{hc/λkT_{b}} − 1)] = ε_{λ} · B(λ, T);   T = hc / [kλ · ln(1 − ε_{λ} + ε_{λ} e^{hc/λkT_{b}})]', vars: [['L', 'recorded radiance'], ['T_{b}', 'brightness temperature'], ['T', 'physical (surface) temperature'], ['ε_{λ}', 'spectral emissivity'], ['h, c, k', 'Planck constant, speed of light, Boltzmann constant'], ['λ', 'wavelength']], units: 'K', example: '300 K surface, ε = 0.8 at 10 µm → T_b ≈ 286.8 K (≈ 13 K lower)', assume: 'Atmospheric effects ignored.', p: [12] });
F({ id: 'f-splitwindow', lec: 'L12', topic: 'L12-thermalapps', name: 'MODIS LST split-window (Wan)', expr: 'T_{s} = C + (A_{1} + A_{2}(1−ε)/ε + A_{3}Δε/ε²)(T_{31}+T_{32})/2 + (B_{1} + B_{2}(1−ε)/ε + B_{3}Δε/ε²)(T_{31}−T_{32})/2', vars: [['T_{31}, T_{32}', 'brightness temperatures in MODIS bands 31, 32'], ['ε', '(ε_{31} + ε_{32}) / 2'], ['Δε', 'ε_{31} − ε_{32}'], ['A, B, C', 'coefficients from multidimensional lookup tables (depend on angle)']], units: 'K', example: 'Recognize the structure: mean term (T31+T32)/2 plus difference term (T31−T32)/2.', assume: 'Coefficients depend on viewing angle.', p: [18] });
F({ id: 'f-freq', lec: 'L12', topic: 'L12-mw', name: 'Frequency–wavelength relation', expr: 'ν = c / λ;   ν(GHz) = 30 / λ(cm)', vars: [['ν', 'frequency (Hz = s⁻¹; GHz = 10⁹ Hz)'], ['c', 'speed of light = 3.00 × 10⁸ m s⁻¹'], ['λ', 'wavelength']], units: 'Hz / GHz', example: 'λ = 3 cm → 10 GHz; λ = 23.5 cm → 1.28 GHz', assume: 'The 30/λ trick needs λ in centimetres.', p: [31] });
F({ id: 'f-rangeres', lec: 'L12', topic: 'L12-geom', name: 'Range resolution', expr: 'R_{r} = τ c / (2 cos γ)', vars: [['τ', 'pulse length (s)'], ['c', 'speed of light (3 × 10⁸ m s⁻¹)'], ['γ', 'depression angle']], units: 'm', example: 'τ = 0.1×10⁻⁶ s: γ = 65° → 35.5 m; γ = 40° → 19.58 m', assume: 'Equivalent to τc/(2 sin θ) with look angle θ.', p: [53] });
F({ id: 'f-azres', lec: 'L12', topic: 'L12-geom', name: 'Azimuth resolution (real aperture)', expr: 'R_{a} = S × λ / L', vars: [['S', 'slant range'], ['λ', 'wavelength'], ['L', 'antenna length']], units: 'm', example: 'S = 20 km → 120 m; S = 40 km → 240 m (λ/L = 0.006)', assume: 'Real aperture radar beam.', p: [54] });

// ── content\50-figures.js
// Original inline SVG figures. Colors come from CSS classes (theme-aware); every figure has a text alternative.
const FIG = (function () {
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let uid = 0;
  // Each SVG gets its own marker/gradient ids so several figures can share one page without duplicate ids.
  const svg = (w, h, label, body) => { const id = 'f' + (++uid); body = body.replace(/url\(#ah\)/g, `url(#${id}ah)`).replace(/id="gr(\d)"/g, `id="${id}gr$1"`).replace(/url\(#gr(\d)\)/g, `url(#${id}gr$1)`); return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}" class="fig-svg" xmlns="http://www.w3.org/2000/svg"><title>${esc(label)}</title><defs><marker id="${id}ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fg-ah"/></marker></defs>${body}</svg>`; };
  const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" class="fg-tx${o.cls ? ' ' + o.cls : ''}"${o.a ? ` text-anchor="${o.a}"` : ''}${o.size ? ` font-size="${o.size}"` : ''}${o.w ? ` font-weight="${o.w}"` : ''}${o.rot ? ` transform="rotate(${o.rot} ${x} ${y})"` : ''}>${esc(s)}</text>`;
  const L = (x1, y1, x2, y2, o = {}) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${o.cls || 'fg-ln'}"${o.arrow ? ' marker-end="url(#ah)"' : ''}${o.dash ? ' stroke-dasharray="5 4"' : ''}${o.sw ? ` stroke-width="${o.sw}"` : ''}/>`;
  const R = (x, y, w, h, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx == null ? 6 : o.rx}" class="${o.cls || 'fg-box'}"${o.dash ? ' stroke-dasharray="5 4"' : ''}/>`;
  const Ci = (x, y, r, cls) => `<circle cx="${x}" cy="${y}" r="${r}" class="${cls || 'fg-dot'}"/>`;
  const P = (d, cls, o = {}) => `<path d="${d}" class="${cls || 'fg-ln'}"${o.arrow ? ' marker-end="url(#ah)"' : ''}${o.dash ? ' stroke-dasharray="5 4"' : ''}/>`;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

  const F = {};

  F['fig-process'] = () => svg(640, 270, 'Image interpretation process diagram', [
    R(20, 30, 150, 52), T(95, 62, 'Image', { a: 'middle', w: 600 }),
    R(20, 150, 200, 62), T(120, 176, 'Interpreter’s skills', { a: 'middle' }), T(120, 196, 'and knowledge level', { a: 'middle' }),
    `<ellipse cx="350" cy="112" rx="100" ry="52" class="fg-box-a"/>`, T(350, 108, 'Interpretation', { a: 'middle', w: 600 }), T(350, 128, 'process', { a: 'middle', w: 600 }),
    R(490, 78, 135, 72), T(557, 104, 'INFORMATION', { a: 'middle', w: 600 }), T(557, 122, '– quality', { a: 'middle' }), T(557, 140, '– quantity', { a: 'middle' }),
    L(170, 62, 255, 92, { arrow: true }), L(220, 175, 260, 140, { arrow: true }), L(450, 112, 486, 112, { arrow: true }),
    P('M350,166 C350,240 160,250 130,216', 'fg-ln-b', { arrow: true }), T(290, 252, 'Learning → Perceptions (feedback)', { a: 'middle', cls: 'fg-tx-b' })
  ].join(''));

  F['fig-levels'] = () => svg(720, 300, 'Three levels of interpretation pyramid', [
    `<polygon points="300,20 470,280 130,280" class="fg-fill-c"/>`,
    `<polygon points="300,20 357,107 243,107" class="fg-fill-a"/>`,
    `<polygon points="243,107 357,107 413,193 187,193" class="fg-fill-b"/>`,
    T(300, 85, 'Image reading', { a: 'middle', w: 600, size: 13 }), T(300, 158, 'Image analysis', { a: 'middle', w: 600 }), T(300, 245, 'Image interpretation', { a: 'middle', w: 600 }),
    T(480, 64, 'superficial, quick', { size: 12 }), T(480, 80, 'main features & distribution', { size: 12 }),
    T(430, 150, 'longer, more detailed', { size: 12 }), T(430, 166, 'general & obvious features', { size: 12 }),
    T(10, 230, 'inductive & deductive,', { size: 12 }), T(10, 246, 'with OTHER DATA;', { size: 12 }), T(10, 262, 'functions & inter-relationships', { size: 12 }),
    L(690, 110, 690, 270, { arrow: true }), T(704, 190, 'deeper', { rot: 90, size: 12 })

// ───────── Pure logic: dates, text normalization, answer checking, scheduling, progress ─────────

  function candidates(answer, alts) {
    const out = new Set();
